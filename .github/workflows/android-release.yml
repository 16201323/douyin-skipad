name: Build and publish Android release

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'scripts/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: android-production-release
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore the existing signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if (-not $env:KEYSTORE_BASE64) { throw 'Configure ANDROID_SIGNING_KEYSTORE_BASE64 before publishing.' }
          $keyFile = Join-Path $env:RUNNER_TEMP 'skipad-signing.keystore'
          [IO.File]::WriteAllBytes($keyFile, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "SKIPAD_SIGNING_STORE_FILE=$keyFile" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install Android SDK 34
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_path"
          "$sdkmanager_path" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Test, lint and build signed APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Check release tooling compatibility
        shell: pwsh
        run: ./scripts/Test-ReleaseTools.ps1
      - name: Resolve immutable release package
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $buildText = Get-Content app/build.gradle.kts -Raw
          $version = [regex]::Match($buildText, 'versionName = "([0-9]+\.[0-9]+\.[0-9]+)"').Groups[1].Value
          if (-not $version) { throw 'Missing stable release version.' }
          $tag = "v$version"
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases"
          $existing = $null
          try { $existing = Invoke-RestMethod -Uri "$api/tags/$tag" -Headers $headers }
          catch { if ([int]$_.Exception.Response.StatusCode -ne 404) { throw } }
          try {
            $latest = Invoke-RestMethod -Uri "$api/latest" -Headers $headers
            if ([version]$version -lt [version]$latest.tag_name.TrimStart('v')) { throw 'Refusing to roll back the download site.' }
          } catch { if ([int]$_.Exception.Response.StatusCode -ne 404) { throw } }
          New-Item -ItemType Directory -Path build/published -Force | Out-Null
          $apk = 'build/published/douyin-skipad-release.apk'
          if ($existing) {
            if ($existing.draft -or $existing.prerelease) { throw 'This tag is not a stable release.' }
            $assets = @($existing.assets | Where-Object name -eq 'douyin-skipad-release.apk')
            if ($assets.Count -ne 1 -or $assets[0].digest -notmatch '^sha256:[0-9a-f]{64}$') { throw 'Existing release integrity metadata is missing.' }
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern douyin-skipad-release.apk --dir build/published --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Cannot restore the already published APK.' }
            if ((Get-FileHash $apk -Algorithm SHA256).Hash.ToLowerInvariant() -ne $assets[0].digest.Substring(7)) { throw 'Existing release APK digest mismatch.' }
            Write-Output 'This version already exists; reusing its APK without overwriting it.'
          } else {
            Copy-Item -LiteralPath app/build/outputs/apk/release/douyin-skipad-release.apk -Destination $apk
          }
          "version=$version" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "create=$(-not [bool]$existing)" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Prepare and verify static update site
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: ./scripts/Prepare-UpdateSite.ps1 -ApkPath 'build/published/douyin-skipad-release.apk' -NotesPath "docs/releases/v$env:RELEASE_VERSION.md"
      - name: Publish GitHub release
        if: steps.release.outputs.create == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG build/published/douyin-skipad-release.apk --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "$env:RELEASE_TAG - 自动更新" --notes-file "docs/releases/$env:RELEASE_TAG.md"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
      - name: Publish Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/update-site --project-name=douyin-skipad-updates --branch=main
          gitHubToken: ${{ github.token }}
      - name: Verify public update manifest and APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = Get-Content build/update-site/update.json -Raw | ConvertFrom-Json
          $base = 'https://douyin-skipad-updates.pages.dev'
          $verified = $false
          for ($attempt=0; $attempt -lt 5; $attempt++) {
            try {
              $actual = Invoke-RestMethod "$base/update.json" -Headers @{'Cache-Control'='no-cache'} -TimeoutSec 30
              if ($actual.versionName -ne $expected.versionName -or $actual.sha256 -ne $expected.sha256) { throw 'Published manifest is stale.' }
              $download = Join-Path $env:RUNNER_TEMP 'skipad-public-download.apk'
              Invoke-WebRequest "$base/$($actual.apk)" -OutFile $download -TimeoutSec 60
              if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected.sha256) { throw 'Published APK digest mismatch.' }
              $verified = $true; break
            } catch { if ($attempt -eq 4) { throw }; Start-Sleep -Seconds 5 }
          }
          if (-not $verified) { throw 'Public download verification failed.' }
          "Verified $($actual.versionName): $base/$($actual.apk)" | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: android-release
          path: |
            build/published/douyin-skipad-release.apk
            build/update-site/update.json
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'skipad-signing.keystore') -Force -ErrorAction SilentlyContinue
